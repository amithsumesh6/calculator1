<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CALCULATOR</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
        crossorigin="anonymous">
    <link rel="stylesheet" href="./calculator.css">
</head>

<body>

    <div class="card">
        <div class="calculator-container">

            <h1>CALCULATOR</h1>

            <input id="result" class="typ" type="text">

            <div class="button-container">

                <button id="seven" class="btn btn-outline-primary"
                    onclick="displayNumber(7)">7</button>

                <button id="eight" class="btn btn-outline-primary"
                    onclick="displayNumber(8)">8</button>

                <button id="nine" class="btn btn-outline-primary"
                    onclick="displayNumber(9)">9</button>

                <button id="multiple" class="btn btn-outline-info"
                    onclick="displayNumber('*')">&#215;</button>


                <button id="four" class="btn btn-outline-primary"
                    onclick="displayNumber(4)">4</button>

                <button id="five" class="btn btn-outline-primary"
                    onclick="displayNumber(5)">5</button>

                <button id="six" class="btn btn-outline-primary"
                    onclick="displayNumber(6)">6</button>

                <button id="add" class="btn btn-outline-info"
                    onclick="displayNumber('+')">&#43;</button>


                <button id="one" class="btn btn-outline-primary"
                    onclick="displayNumber(1)">1</button>

                <button id="two" class="btn btn-outline-primary"
                    onclick="displayNumber(2)">2</button>

                <button id="three" class="btn btn-outline-primary"
                    onclick="displayNumber(3)">3</button>

                <button id="substract" class="btn btn-outline-info"
                    onclick="displayNumber('-')">&#8722;</button>


                <button id="zero" class="btn btn-outline-primary"
                    onclick="displayNumber(0)">0</button>

                <button id="dot" class="btn btn-outline-primary"
                    onclick="displayNumber('.')">&#46;</button>

                <button id="div" class="btn btn-outline-info"
                    onclick="displayNumber('/')">&#247;</button>

                <button id="del" class="btn btn-outline-light"
                    onclick="removeLastItem()">&#9003;</button>

            </div>

            <div class="bottom-buttons">

                <button id="ac" class="btn btn-outline-danger"
                    onclick="clearBox()">AC</button>

                <button id="equal" class="btn btn-outline-success"
                    onclick="evaluateExp()">&#61;</button>

            </div>

        </div>

    </div>

    <script src="./calculator.js"></script>

</body>

</html>
